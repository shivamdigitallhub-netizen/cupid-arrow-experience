<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cupid Arrow Match | Digital Web Hive</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  height:100vh;
  font-family:system-ui,-apple-system,sans-serif;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  transition:.6s;
}

/* Floating emoji */
.float{
  position:absolute;
  bottom:-20px;
  font-size:22px;
  animation:floatUp linear infinite;
  opacity:.85;
}
@keyframes floatUp{
  to{transform:translateY(-120vh);opacity:0}
}

.card{
  background:#fff;
  padding:32px;
  border-radius:24px;
  width:92%;
  max-width:520px;
  text-align:center;
  box-shadow:0 25px 50px rgba(0,0,0,.25);
  z-index:2;
}

.brand{font-weight:800;font-size:18px}
.tagline{font-size:12px;color:#6b7280;margin-bottom:12px}

h1{margin:10px 0}

input{
  width:100%;
  padding:14px;
  margin-bottom:10px;
  border-radius:10px;
  border:1px solid #ddd;
}

button{
  padding:14px 26px;
  border:none;
  border-radius:999px;
  font-weight:600;
  background:#ff4d6d;
  color:#fff;
  cursor:pointer;
  margin-top:10px;
}

button.secondary{background:#111827;margin:6px}
button.whatsapp{background:#25D366}

#arrow{font-size:48px;margin-top:18px;transition:.5s}
#status{margin-top:12px;font-weight:600}
#result{font-size:20px;font-weight:700;margin-top:18px}
#history{margin-top:10px;font-size:14px;color:#374151}
#cta{margin-top:14px;font-size:13px}
</style>
</head>

<body>

<div class="card">

<div class="brand">Digital Web Hive</div>
<div class="tagline">Interactive Experiences That Convert</div>

<h1>Cupid Arrow Match 💘</h1>

<div id="form">
<input id="name1" placeholder="Your Name">
<input id="name2" placeholder="Partner Name">
<button onclick="shootArrow()">Shoot Cupid Arrow 🏹</button>
</div>

<div id="status"></div>
<div id="arrow">🏹</div>
<div id="result"></div>
<div id="history"></div>

<div id="actions">
<button class="secondary" onclick="share()">📤 Share</button>
<button class="secondary" onclick="location.reload()">🔄 Restart</button>
<br>
<button class="whatsapp" onclick="openWhatsApp()">💬 Chat on WhatsApp</button>
</div>

<div id="cta">
Want interactive campaigns like this?<br>
<strong>Digital Web Hive</strong> • digitalwebhive.com
</div>

</div>

<script>

/* ---------- FLOATING EMOJI SYSTEM ---------- */
let floatingEmoji="❤️";
setInterval(()=>{
  const e=document.createElement("div");
  e.className="float";
  e.innerText=floatingEmoji;
  e.style.left=Math.random()*100+"vw";
  e.style.animationDuration=(4+Math.random()*3)+"s";
  document.body.appendChild(e);
  setTimeout(()=>e.remove(),7000);
},600);

/* ---------- RESULT MAP ---------- */
const cupidResults={
friends:{text:"🤝 Best Friends Energy!",bg:"#a1c4fd",emoji:"🤝"},
love:{text:"❤️ True Love Connection!",bg:"#ff9a9e",emoji:"❤️"},
soul:{text:"💞 Soulmate Vibes!",bg:"#fddb92",emoji:"💞"},
marriage:{text:"💍 Wedding Bells Ahead!",bg:"#fbc2eb",emoji:"💍"},
affection:{text:"🥰 Cute Affection!",bg:"#fad0c4",emoji:"🥰"},
complicated:{text:"😅 It’s Complicated!",bg:"#cfd9df",emoji:"😅"}
};

let n1="",n2="";

/* ---------- HELPER FUNCTIONS ---------- */
function getCommonLetters(a,b){
let arrA=a.split("");
let arrB=b.split("");
let common=[];

arrA.forEach(l=>{
const i=arrB.indexOf(l);
if(i>-1){
common.push(l);
arrB.splice(i,1);
}
});
return common;
}

function isPrime(num){
if(num<2) return false;
for(let i=2;i<=Math.sqrt(num);i++){
if(num%i===0) return false;
}
return true;
}

/* ---------- MAIN GAME ---------- */
function shootArrow(){

n1=name1.value.trim().toLowerCase();
n2=name2.value.trim().toLowerCase();

if(!n1||!n2){
alert("Please enter both names");
return;
}

form.style.display="none";
status.innerText="Cupid is analysing your connection…";

arrow.style.transform="translateX(40px) rotate(20deg)";

setTimeout(()=>{
arrow.innerText="💘";
applyLogic();
},900);

}

/* ---------- SMART RULE LOGIC ---------- */
function applyLogic(){

const vowels=["a","e","i","o","u"];
const common=getCommonLetters(n1.replace(/\s/g,""),n2.replace(/\s/g,""));

const count=common.length;

status.innerText=
`Common letters found: ${common.join(", ") || "None"} (${count})`;

let vowelCount=common.filter(l=>vowels.includes(l)).length;

let resultKey="complicated";

/* Rule 1: Prime number → Love direction */
if(isPrime(count)){
resultKey="love";
}

/* Rule 2: Many vowels → Friends/Affection */
if(vowelCount>0 && vowelCount>=count/2){
resultKey="friends";
}

/* Rule 3: High match count → Marriage */
if(count>=5){
resultKey="marriage";
}

/* Rule 4: Medium match + prime → Soulmates */
if(count===3 || count===7){
resultKey="soul";
}

showResult(resultKey);
}

/* ---------- SHOW RESULT ---------- */
function showResult(key){

const r=cupidResults[key];

document.body.style.background=
`linear-gradient(135deg,${r.bg},#ffffff)`;

floatingEmoji=r.emoji;

result.innerText=r.text;

history.innerHTML=
`Last match: <strong>${n1}</strong> ${r.emoji} <strong>${n2}</strong>`;

localStorage.setItem("cupidLast",
JSON.stringify({name1:n1,name2:n2,result:r.text}));

}

/* ---------- SHARE ---------- */
function share(){
navigator.clipboard.writeText(
`Cupid Match by Digital Web Hive:\n${n1} ${floatingEmoji} ${n2}\n${result.innerText}`
);
alert("Result copied 🚀");
}

/* ---------- WHATSAPP CTA ---------- */
function openWhatsApp(){
const msg=encodeURIComponent(
"Hi Digital Web Hive! I loved this Cupid Arrow experience and want something similar for my brand."
);
window.open("https://wa.me/64212456560?text="+msg,"_blank");
}

/* ---------- LOAD HISTORY ---------- */
window.onload=()=>{
const data=localStorage.getItem("cupidLast");
if(data){
const last=JSON.parse(data);
history.innerHTML=
`Last match: <strong>${last.name1}</strong> ❤️ <strong>${last.name2}</strong>`;
}
};

</script>

</body>
</html>
