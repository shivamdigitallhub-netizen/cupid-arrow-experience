<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cupid Arrow Experience | Digital Web Hive</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
height:100vh;
font-family:system-ui,-apple-system,sans-serif;
background:linear-gradient(135deg,#ffd1dc,#ffe4e1);
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
transition:.6s;
}

/* Aura Glow */
.auraSoft{animation:auraSoft 3s ease-in-out infinite alternate;}
.auraStrong{animation:auraStrong 2.4s ease-in-out infinite alternate;}
@keyframes auraSoft{from{box-shadow:0 0 20px rgba(255,77,109,.25)}to{box-shadow:0 0 45px rgba(255,77,109,.45)}}
@keyframes auraStrong{from{box-shadow:0 0 30px rgba(255,77,109,.45)}to{box-shadow:0 0 75px rgba(255,77,109,.75)}}

/* Floating emoji */
.float{position:absolute;bottom:-20px;font-size:20px;animation:floatUp linear infinite;opacity:.85;}
@keyframes floatUp{to{transform:translateY(-120vh);opacity:0}}

/* Heart Burst */
.burst{position:absolute;font-size:28px;animation:burst 1s ease-out forwards;}
@keyframes burst{0%{transform:scale(.5);opacity:1}100%{transform:translateY(-120px) scale(1.6);opacity:0}}

.card{
background:#fff;
padding:36px;
border-radius:26px;
width:92%;
max-width:560px;
text-align:center;
box-shadow:0 25px 60px rgba(0,0,0,.2);
z-index:2;
}

.brand{font-weight:800;font-size:18px}
.tagline{font-size:12px;color:#6b7280;margin-bottom:10px}

input{width:100%;padding:14px;margin-bottom:10px;border-radius:10px;border:1px solid #eee;}

button{
padding:14px 26px;
border:none;
border-radius:999px;
font-weight:600;
background:#ff4d6d;
color:#fff;
cursor:pointer;
margin-top:10px;
}

.secondary{background:#111827;margin:6px}
.whatsapp{background:#25D366}

#cupidIcon{font-size:64px;margin-top:14px;transition:.6s;}
.rotate{animation:spin 1.2s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

#analysis{margin-top:14px;font-size:14px;color:#374151;line-height:1.6;min-height:60px;}

#meter{margin-top:14px;height:14px;background:#eee;border-radius:20px;overflow:hidden;}
#bar{height:100%;width:0%;background:#ff4d6d;}

#score{font-size:18px;font-weight:700;margin-top:8px;}
#pairTitle{font-size:20px;font-weight:700;margin-top:12px;color:#ff4d6d;}
#result{font-size:24px;font-weight:700;margin-top:10px;}
#history{margin-top:10px;font-size:14px;color:#374151;}
</style>
</head>

<body>

<div class="card" id="card">

<div class="brand">Digital Web Hive</div>
<div class="tagline">Interactive Experiences That Convert</div>

<h1>Cupid Arrow Experience 💖</h1>

<div id="form">
<input id="name1" placeholder="Your Name">
<input id="name2" placeholder="Partner Name">
<button onclick="startAI()">Reveal Love Energy 💘</button>
</div>

<div id="cupidIcon">🏹</div>
<div id="analysis"></div>

<div id="meter"><div id="bar"></div></div>
<div id="score"></div>

<div id="pairTitle"></div>
<div id="result"></div>
<div id="history"></div>

<div>
<button class="secondary" onclick="share()">📤 Share</button>
<button class="secondary" onclick="location.reload()">🔄 Restart</button>
<br>
<button class="whatsapp" onclick="openWhatsApp()">💬 Chat on WhatsApp</button>
</div>

</div>

<script>

/* Floating emoji */
let floatingEmoji="❤️";
setInterval(()=>{
const e=document.createElement("div");
e.className="float";
e.innerText=floatingEmoji;
e.style.left=Math.random()*100+"vw";
e.style.animationDuration=(4+Math.random()*3)+"s";
document.body.appendChild(e);
setTimeout(()=>e.remove(),7000);
},700);

const results={
friends:{text:"🤝 Best Friends Energy!",bg:"#cde7ff",emoji:"🤝"},
love:{text:"❤️ True Love Connection!",bg:"#ffd1dc",emoji:"❤️"},
soul:{text:"💞 Soulmate Vibes!",bg:"#ffe4e1",emoji:"💞"},
marriage:{text:"💍 Wedding Bells Ahead!",bg:"#fbc2eb",emoji:"💍"},
affection:{text:"🥰 Cute Affection!",bg:"#fad0c4",emoji:"🥰"},
complicated:{text:"😅 It’s Complicated!",bg:"#e5e7eb",emoji:"😅"}
};

let n1="",n2="";

/* Voice AI typing */
function typeAI(text,delay=20){
return new Promise(resolve=>{
let i=0;
const interval=setInterval(()=>{
analysis.innerHTML+=text.charAt(i);
i++;
if(i>=text.length){
clearInterval(interval);
analysis.innerHTML+="<br>";
resolve();
}
},delay);
});
}

function getCommon(a,b){
let A=a.split("");let B=b.split("");let c=[];
A.forEach(l=>{const i=B.indexOf(l);if(i>-1){c.push(l);B.splice(i,1);}});
return c;
}

function isPrime(n){
if(n<2)return false;
for(let i=2;i<=Math.sqrt(n);i++){if(n%i===0)return false;}
return true;
}

async function startAI(){

n1=name1.value.trim();
n2=name2.value.trim();

if(!n1||!n2){alert("Enter both names");return;}

form.style.display="none";
cupidIcon.classList.add("rotate");
analysis.innerHTML="";

await typeAI("💘 Cupid Arrow AI scanning emotional energy…");
await typeAI("❤️ Checking vowel harmony…");
await typeAI("🔢 Calculating destiny alignment…");

cupidIcon.classList.remove("rotate");
cupidIcon.innerText="💘";

runLogic();
}

function runLogic(){

const vowels=["a","e","i","o","u"];
const common=getCommon(n1.toLowerCase().replace(/\s/g,""),n2.toLowerCase().replace(/\s/g,""));
const count=common.length;
const vowelCount=common.filter(l=>vowels.includes(l)).length;

let scoreVal=30+count*10+vowelCount*8;
if(isPrime(count)) scoreVal+=15;
if(scoreVal>100) scoreVal=100;

let current=0;
const interval=setInterval(()=>{
current++;
bar.style.width=current+"%";
score.innerText="Compatibility: "+current+"%";
if(current>=scoreVal) clearInterval(interval);
},20);

let key="complicated";
if(scoreVal>85) key="marriage";
else if(scoreVal>70) key="soul";
else if(scoreVal>55) key="love";
else if(scoreVal>40) key="friends";
else if(scoreVal>30) key="affection";

setTimeout(()=>showResult(key,common,scoreVal),1200);
}

function showResult(key,common,scoreVal){

const r=results[key];
const card=document.getElementById("card");

document.body.style.background=
`linear-gradient(135deg,${r.bg},#ffffff)`;

floatingEmoji=r.emoji;

card.classList.remove("auraSoft","auraStrong");
if(scoreVal>75){card.classList.add("auraStrong");}
else{card.classList.add("auraSoft");}

pairTitle.innerText=`${n1} ${r.emoji} ${n2}`;

analysis.innerHTML+=`<br>Common Letters: ${common.join(", ")||"None"}<br>Match Score: ${scoreVal}%`;

result.innerText=r.text;

history.innerHTML=
`Last match: <strong>${n1}</strong> ${r.emoji} <strong>${n2}</strong>`;

/* heart burst */
for(let i=0;i<14;i++){
const h=document.createElement("div");
h.className="burst";
h.innerText=r.emoji;
h.style.left=(45+Math.random()*10)+"vw";
h.style.bottom="40vh";
document.body.appendChild(h);
setTimeout(()=>h.remove(),1000);
}
}

function share(){
navigator.clipboard.writeText(
`${n1} ${floatingEmoji} ${n2} — ${result.innerText}`
);
alert("Result copied 🚀");
}

function openWhatsApp(){
const msg=encodeURIComponent(
"Hi Digital Web Hive! I loved the Cupid Arrow Experience."
);
window.open("https://wa.me/64212456560?text="+msg,"_blank");
}

</script>
</body>
</html>
